name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lipila_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      # The suite skips silently without this variable, so it runs as its own job
      # to guarantee the adapter is exercised against a real engine on every change.
      - name: Run PostgreSQL integration suite
        env:
          LIPILA_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/lipila_test
        run: npm run test:integration -w @cozycodr/lipila-store-postgres
